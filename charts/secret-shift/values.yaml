# Default values for secret-shift.

replicaCount: 1

image:
  repository: ghcr.io/papadanielvi/secret-shift
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources: {}

# -- Mode of operation: "one-shot", "periodic", or "server"
# one-shot: runs once and exits (use with CronJob)
# periodic: runs sync on a loop (use with Deployment)
# server: starts HTTP server with health endpoints + periodic sync (use with Deployment)
mode: server

# -- Sync frequency for periodic/server mode
syncFrequency: "5m"

# -- CronJob schedule (only used when mode is "one-shot" and useCronJob is true)
schedule: "*/10 * * * *"

# -- Use CronJob instead of one-shot Job
useCronJob: false

# -- Health server port (used in server mode)
healthPort: 8080

probes:
  liveness:
    path: /healthz
    port: 8080
  readiness:
    path: /readyz
    port: 8080

# -- ConfigMap configuration
config:
  # -- Use an existing ConfigMap instead of creating one
  existingConfigMap: ""
  # -- Inline config data (used when existingConfigMap is empty)
  data: {}
  # Example:
  # data:
  #   secret-shift.json: |
  #     {
  #       "source": { "type": "vault", "vault_address": "https://vault:8200", "vault_path": "secret/app" },
  #       "destination": { "type": "kubernetes", "kube_namespace": "default" }
  #     }

# -- Secret references for sensitive values
secrets: {}
# Example:
# secrets:
#   SECRET_SHIFT_SRC_VAULT_TOKEN: "vault-token-here"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
