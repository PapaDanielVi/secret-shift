version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X github.com/PapaDanielVi/secret-shift/cmd.Version={{ .Tag }}"

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}


nfpms:
  - id: secret-shift
    package_name: secret-shift
    maintainer: "PapaDanielVi <k2527806@gmail.com>"
    description: "SecretShift is a CLI tool for migrating and syncing secrets and environment variables between providers"
    license: "MIT"
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux

homebrew_casks:
  - name: secret-shift

    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

    url:
      verified: https://github.com/PapaDanielVi/secret-shift

    hooks:
      post:
        # replace foo with the actual binary name
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/secret-shift"]
          end

    homepage: "https://github.com/PapaDanielVi/secret-shift"
    description: "SecretShift is a CLI tool for migrating and syncing secrets and environment variables between providers"
    license: "MIT"
